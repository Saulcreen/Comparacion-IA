<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traductor IA con Voz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 30px;
    width: 100%;
    max-width: 620px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 5px;
    background: linear-gradient(90deg,#7f5af0,#2cb67d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    text-align: center;
    color: #aaa;
    font-size: 0.85rem;
    margin-bottom: 25px;
  }
  label {
    font-size: 0.8rem;
    color: #bbb;
    display: block;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  textarea, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 0.95rem;
    resize: vertical;
    outline: none;
  }
  textarea { min-height: 90px; }
  select { cursor: pointer; }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg,#7f5af0,#2cb67d);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-box {
    margin-top: 20px;
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    padding: 16px;
    min-height: 60px;
    font-size: 1rem;
    line-height: 1.5;
    white-space: pre-wrap;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .controls button {
    margin-top: 0;
    flex: 1;
    background: rgba(255,255,255,0.1);
    font-weight: 500;
    font-size: 0.85rem;
    padding: 10px;
  }
  .status {
    text-align: center;
    font-size: 0.8rem;
    color: #888;
    margin-top: 10px;
    min-height: 16px;
  }
  .error { color: #ff6b6b; }
  .upload-area {
    margin-top: 6px;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    color: #aaa;
    font-size: 0.85rem;
  }
  .upload-area:hover, .upload-area.dragover {
    background: rgba(255,255,255,0.06);
    border-color: #7f5af0;
  }
  #scanBtn {
    margin-top: 10px;
    background: rgba(255,255,255,0.1);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
  }
  .image-wrapper {
    position: relative;
    display: inline-block;
    margin-top: 10px;
  }
  .image-wrapper img {
    max-width: 100%;
    max-height: 180px;
    border-radius: 8px;
    display: block;
  }
  .remove-img-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ff5566;
    color: #fff;
    border: none;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .remove-img-btn:hover { background: #ff2d44; transform: none; }
  .upload-area.paste-hint::after {
    content: " (también puedes pegar con Ctrl+V)";
    opacity: 0.7;
  }
  .compare-toggle {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: #ccc;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: rgba(255,255,255,0.2);
    border-radius: 24px;
    transition: 0.2s;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider {
    background: linear-gradient(90deg,#7f5af0,#2cb67d);
  }
  .switch input:checked + .slider::before {
    transform: translateX(20px);
  }
  .compare-grid {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .compare-col {
    flex: 1;
    min-width: 160px;
  }
  .compare-label {
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 6px;
    text-align: center;
    padding: 4px;
    border-radius: 6px;
  }
  .compare-label.ai { background: rgba(127,90,240,0.2); color: #b9a3ff; }
  .compare-label.google { background: rgba(66,133,244,0.2); color: #8ab4f8; }
  #explainBtn {
    background: rgba(255,255,255,0.1);
    font-size: 0.85rem;
  }
  #explainBox {
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .compare-box {
    margin-top: 0;
    min-height: 90px;
    font-size: 0.88rem;
  }
  .speak-mini {
    margin-top: 8px;
    padding: 8px;
    font-size: 0.75rem;
    background: rgba(255,255,255,0.1);
  }
  @media (max-width: 560px) {
    .compare-grid { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h1>🌐 Traductor IA con Voz</h1>
  </div>
  <div class="subtitle">Powered by Groq API + Web Speech API</div>

  <label for="inputText">Texto a traducir</label>
  <textarea id="inputText" placeholder="Escribe aquí el texto que quieres traducir..."></textarea>

  <label for="imageInput">O escanea una imagen con texto 📷</label>
  <div class="upload-area paste-hint" id="uploadArea">
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <span id="uploadLabel">Haz clic o arrastra una imagen aquí</span>
    <div class="image-wrapper" id="imageWrapper" style="display:none;">
      <img id="imagePreview">
      <button type="button" class="remove-img-btn" id="removeImgBtn" title="Quitar imagen">✕</button>
    </div>
  </div>
  <div class="result-box" id="imageInfoBox" style="display:none;"></div>
  <button id="scanBtn" type="button" disabled>🔍 Escanear y analizar imagen</button>

  <div class="row">
    <div>
      <label for="targetLang">Traducir a</label>
      <select id="targetLang">
        <option value="inglés" selected>Inglés</option>
        <option value="español">Español</option>
        <option value="francés">Francés</option>
        <option value="alemán">Alemán</option>
        <option value="italiano">Italiano</option>
        <option value="portugués">Portugués</option>
        <option value="japonés">Japonés</option>
        <option value="coreano">Coreano</option>
        <option value="chino mandarín">Chino mandarín</option>
        <option value="ruso">Ruso</option>
      </select>
    </div>
    <div>
      <label for="voiceLang">Voz para leer</label>
      <select id="voiceLang"></select>
    </div>
  </div>

  <div class="compare-toggle" id="compareToggle">
    <span>🔬 Modo Comparación (IA vs Google)</span>
    <label class="switch">
      <input type="checkbox" id="compareCheckbox">
      <span class="slider"></span>
    </label>
  </div>

  <button id="translateBtn">Traducir y Hablar</button>

  <div class="result-box" id="resultBox">La traducción aparecerá aquí...</div>

  <div id="compareResults" style="display:none;">
    <div class="compare-grid">
      <div class="compare-col">
        <div class="compare-label ai">🤖 Nuestra IA (Groq)</div>
        <div class="result-box compare-box" id="resultAI">...</div>
        <button type="button" class="speak-mini" data-target="ai">🔊 Escuchar</button>
      </div>
      <div class="compare-col">
        <div class="compare-label google">🟦 Google Translate</div>
        <div class="result-box compare-box" id="resultGoogle">...</div>
        <button type="button" class="speak-mini" data-target="google">🔊 Escuchar</button>
      </div>
    </div>
    <button type="button" id="explainBtn" style="margin-top:14px; display:none;">❓ ¿Por qué son distintas las traducciones/pronunciaciones?</button>
    <div class="result-box" id="explainBox" style="display:none;"></div>
  </div>

  <hr style="border-color: rgba(255,255,255,0.1); margin: 26px 0;">

  <label for="imagePrompt">🎨 Generador de Imágenes IA</label>
  <textarea id="imagePrompt" placeholder="Describe la imagen que quieres generar... ej: un dragón en un castillo gótico al atardecer"></textarea>
  <button type="button" id="generateImgBtn">✨ Generar Imagen</button>
  <div id="generatedImgWrapper" style="display:none; text-align:center; margin-top:14px;">
    <img id="generatedImg" style="max-width:100%; border-radius:12px; border:1px solid rgba(255,255,255,0.15);">
    <div style="margin-top:10px;">
      <a id="downloadImgLink" download="imagen-generada.png" style="display:inline-block; padding:10px 18px; border-radius:8px; background:rgba(255,255,255,0.1); color:#fff; text-decoration:none; font-size:0.85rem;">⬇ Descargar imagen</a>
    </div>
  </div>

  <div class="controls">
    <button id="speakBtn" disabled>🔊 Repetir voz</button>
    <button id="stopBtn" disabled>⏹ Detener</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const inputText = document.getElementById('inputText');
const targetLang = document.getElementById('targetLang');
const voiceLangSelect = document.getElementById('voiceLang');
const translateBtn = document.getElementById('translateBtn');
const resultBox = document.getElementById('resultBox');
const speakBtn = document.getElementById('speakBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');

const imageInput = document.getElementById('imageInput');
const uploadArea = document.getElementById('uploadArea');
const uploadLabel = document.getElementById('uploadLabel');
const imageWrapper = document.getElementById('imageWrapper');
const imagePreview = document.getElementById('imagePreview');
const removeImgBtn = document.getElementById('removeImgBtn');
const scanBtn = document.getElementById('scanBtn');
const imageInfoBox = document.getElementById('imageInfoBox');

let selectedImageBase64 = null;

// ---- Llamada genérica al backend (la API key vive solo en Vercel) ----
async function callGroq(model, messages, temperature = 0.3) {
  const response = await fetch('/api/groq', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages, temperature })
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error?.message || `Error HTTP ${response.status}`);
  }
  return data;
}

// ---- Subida de imagen: clic, drag&drop y pegar (Ctrl+V) ----
uploadArea.addEventListener('click', (e) => {
  if (e.target === removeImgBtn) return;
  imageInput.click();
});

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    handleImageFile(e.dataTransfer.files[0]);
  }
});

imageInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleImageFile(e.target.files[0]);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) {
        handleImageFile(file);
        statusEl.textContent = "Imagen pegada desde el portapapeles.";
      }
      e.preventDefault();
      break;
    }
  }
});

removeImgBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  removeImage();
});

function removeImage() {
  selectedImageBase64 = null;
  imageInput.value = "";
  imageWrapper.style.display = 'none';
  imagePreview.src = "";
  uploadLabel.textContent = "Haz clic o arrastra una imagen aquí";
  uploadLabel.style.display = 'inline';
  scanBtn.disabled = true;
  imageInfoBox.style.display = 'none';
  imageInfoBox.innerHTML = "";
}

function handleImageFile(file) {
  if (!file.type.startsWith('image/')) {
    statusEl.innerHTML = '<span class="error">⚠ El archivo debe ser una imagen</span>';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImageBase64 = e.target.result;
    imagePreview.src = selectedImageBase64;
    imageWrapper.style.display = 'inline-block';
    uploadLabel.style.display = 'none';
    scanBtn.disabled = false;
    statusEl.textContent = "Imagen lista para escanear.";
  };
  reader.readAsDataURL(file);
}

scanBtn.addEventListener('click', async () => {
  if (!selectedImageBase64) {
    statusEl.innerHTML = '<span class="error">⚠ Selecciona o pega una imagen primero</span>';
    return;
  }

  scanBtn.disabled = true;
  imageInfoBox.style.display = 'none';
  statusEl.textContent = "Analizando imagen con IA (Groq Vision)...";

  try {
    const data = await callGroq(
      "meta-llama/llama-4-scout-17b-16e-instruct",
      [
        {
          role: "user",
          content: [
            {
              type: "text",
              text: "Analiza esta imagen y responde ÚNICAMENTE con un objeto JSON válido (sin markdown, sin \`\`\`), con exactamente estas claves:\n" +
              "\"descripcion\": una descripción clara y detallada en español de qué es la imagen, qué objetos/personas/escena contiene (2-4 frases).\n" +
              "\"texto_detectado\": todo el texto visible en la imagen tal cual aparece, sin traducir. Si no hay ningún texto, pon una cadena vacía \"\"."
            },
            {
              type: "image_url",
              image_url: { url: selectedImageBase64 }
            }
          ]
        }
      ],
      0.2
    );

    let raw = data.choices?.[0]?.message?.content?.trim() || "{}";
    raw = raw.replace(/```json|```/g, "").trim();

    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch {
      parsed = { descripcion: raw, texto_detectado: "" };
    }

    const descripcion = parsed.descripcion || "No se pudo generar una descripción.";
    const textoDetectado = (parsed.texto_detectado || "").trim();

    imageInfoBox.innerHTML = `<strong>🖼️ Qué es la imagen:</strong><br>${descripcion}`;
    imageInfoBox.style.display = 'block';

    if (textoDetectado) {
      inputText.value = textoDetectado;
      statusEl.textContent = "✅ Imagen analizada y texto extraído. Ya puedes traducirlo.";
    } else {
      inputText.value = "";
      statusEl.textContent = "✅ Imagen analizada. No se detectó texto en ella.";
    }

  } catch (err) {
    statusEl.innerHTML = `<span class="error">Error al escanear: ${err.message}</span>`;
  } finally {
    scanBtn.disabled = false;
  }
});

let lastTranslation = "";

const langCodeMap = {
  "inglés": "en", "español": "es", "francés": "fr", "alemán": "de",
  "italiano": "it", "portugués": "pt", "japonés": "ja", "coreano": "ko",
  "chino mandarín": "zh", "ruso": "ru"
};

const googleCodeMap = {
  "inglés": "en", "español": "es", "francés": "fr", "alemán": "de",
  "italiano": "it", "portugués": "pt", "japonés": "ja", "coreano": "ko",
  "chino mandarín": "zh-CN", "ruso": "ru"
};

const compareCheckbox = document.getElementById('compareCheckbox');
const compareResults = document.getElementById('compareResults');
const resultAI = document.getElementById('resultAI');
const resultGoogle = document.getElementById('resultGoogle');
const explainBtn = document.getElementById('explainBtn');
const explainBox = document.getElementById('explainBox');

compareCheckbox.addEventListener('change', () => {
  if (compareCheckbox.checked) {
    resultBox.style.display = 'none';
    compareResults.style.display = 'block';
  } else {
    resultBox.style.display = 'block';
    compareResults.style.display = 'none';
    explainBtn.style.display = 'none';
    explainBox.style.display = 'none';
  }
});

const lastTranslations = { ai: "", google: "" };

document.querySelectorAll('.speak-mini').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-target');
    const text = lastTranslations[target];
    if (text) speakText(text);
  });
});

async function translateWithGoogle(text, targetCode) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetCode}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return data[0].map(part => part[0]).join("");
}

explainBtn.addEventListener('click', async () => {
  explainBtn.disabled = true;
  explainBox.style.display = 'block';
  explainBox.textContent = "Analizando las diferencias...";

  try {
    const prompt = `Texto original: "${inputText.value.trim()}"
Idioma destino: ${targetLang.value}

Traducción 1 (IA - Groq): "${lastTranslations.ai}"
Traducción 2 (Google Translate): "${lastTranslations.google}"

Explica en español, de forma breve y clara (máximo 5-6 frases, en viñetas si ayuda), por qué estas dos traducciones pueden diferir entre sí en palabras elegidas, tono, formalidad o estructura, y por qué la pronunciación al leerlas en voz alta también podría sonar distinta (acentos regionales, ritmo, elección de sinónimos, etc). No repitas las traducciones completas, solo explica las diferencias clave.`;

    const data = await callGroq(
      "llama-3.3-70b-versatile",
      [
        { role: "system", content: "Eres un lingüista experto explicando diferencias entre traducciones de forma breve y didáctica." },
        { role: "user", content: prompt }
      ],
      0.5
    );

    explainBox.textContent = data.choices?.[0]?.message?.content?.trim() || "No se pudo generar la explicación.";
  } catch (err) {
    explainBox.innerHTML = `<span class="error">Error: ${err.message}</span>`;
  } finally {
    explainBtn.disabled = false;
  }
});

let availableVoices = [];

function loadVoices() {
  availableVoices = speechSynthesis.getVoices();
  voiceLangSelect.innerHTML = "";
  if (availableVoices.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = "Cargando voces...";
    voiceLangSelect.appendChild(opt);
    return;
  }
  availableVoices.forEach((voice, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${voice.name} (${voice.lang})`;
    voiceLangSelect.appendChild(opt);
  });
  autoSelectVoiceForLang();
}

function autoSelectVoiceForLang() {
  const code = langCodeMap[targetLang.value] || "en";
  const matches = availableVoices
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => v.lang.toLowerCase().startsWith(code));

  if (matches.length === 0) return;

  const googleMatch = matches.find(({ v }) => v.name.toLowerCase().includes('google'));
  const chosen = googleMatch || matches[0];
  voiceLangSelect.value = chosen.i;
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
targetLang.addEventListener('change', autoSelectVoiceForLang);

function speakText(text) {
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  const idx = voiceLangSelect.value;
  if (availableVoices[idx]) {
    utterance.voice = availableVoices[idx];
    utterance.lang = availableVoices[idx].lang;
  }
  utterance.rate = 1;
  utterance.onstart = () => {
    speakBtn.disabled = true;
    stopBtn.disabled = false;
  };
  utterance.onend = () => {
    speakBtn.disabled = false;
    stopBtn.disabled = true;
  };
  speechSynthesis.speak(utterance);
}

stopBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  speakBtn.disabled = false;
  stopBtn.disabled = true;
});

speakBtn.addEventListener('click', () => {
  if (lastTranslation) speakText(lastTranslation);
});

async function translateWithGroq(text, lang) {
  const data = await callGroq(
    "llama-3.3-70b-versatile",
    [
      {
        role: "system",
        content: `Eres un traductor profesional. Traduce el texto del usuario al idioma: ${lang}. Responde ÚNICAMENTE con la traducción, sin explicaciones, comillas ni texto adicional.`
      },
      { role: "user", content: text }
    ],
    0.3
  );
  return data.choices?.[0]?.message?.content?.trim() || "(sin respuesta)";
}

translateBtn.addEventListener('click', async () => {
  const text = inputText.value.trim();
  const lang = targetLang.value;

  if (!text) {
    statusEl.innerHTML = '<span class="error">⚠ Escribe un texto para traducir</span>';
    return;
  }

  translateBtn.disabled = true;
  explainBtn.style.display = 'none';
  explainBox.style.display = 'none';

  if (compareCheckbox.checked) {
    statusEl.textContent = "Comparando traducciones (IA vs Google)...";
    resultAI.textContent = "Traduciendo...";
    resultGoogle.textContent = "Traduciendo...";

    const [aiRes, googleRes] = await Promise.allSettled([
      translateWithGroq(text, lang),
      translateWithGoogle(text, googleCodeMap[lang] || "en")
    ]);

    if (aiRes.status === 'fulfilled') {
      resultAI.textContent = aiRes.value;
      lastTranslations.ai = aiRes.value;
      lastTranslation = aiRes.value;
      speakBtn.disabled = false;
      speakText(aiRes.value);
    } else {
      resultAI.innerHTML = `<span class="error">${aiRes.reason.message}</span>`;
    }

    if (googleRes.status === 'fulfilled') {
      resultGoogle.textContent = googleRes.value;
      lastTranslations.google = googleRes.value;
    } else {
      resultGoogle.innerHTML = `<span class="error">${googleRes.reason.message}</span>`;
    }

    statusEl.textContent = "✅ Comparación lista. Reproduciendo voz de nuestra IA...";
    explainBtn.style.display = 'block';
    translateBtn.disabled = false;
    return;
  }

  statusEl.textContent = "Traduciendo con IA (Groq)...";
  resultBox.textContent = "...";

  try {
    const translated = await translateWithGroq(text, lang);
    lastTranslation = translated;
    resultBox.textContent = translated;
    statusEl.textContent = "✅ Traducción completa. Reproduciendo voz...";
    speakBtn.disabled = false;
    speakText(translated);
  } catch (err) {
    resultBox.textContent = "—";
    statusEl.innerHTML = `<span class="error">Error: ${err.message}</span>`;
  } finally {
    translateBtn.disabled = false;
  }
});

// ---- Generador de Imágenes IA (Pollinations.ai - gratis, sin API key) ----
const imagePromptInput = document.getElementById('imagePrompt');
const generateImgBtn = document.getElementById('generateImgBtn');
const generatedImgWrapper = document.getElementById('generatedImgWrapper');
const generatedImg = document.getElementById('generatedImg');
const downloadImgLink = document.getElementById('downloadImgLink');

generateImgBtn.addEventListener('click', () => {
  const prompt = imagePromptInput.value.trim();
  if (!prompt) {
    statusEl.innerHTML = '<span class="error">⚠ Escribe una descripción para la imagen</span>';
    return;
  }

  generateImgBtn.disabled = true;
  statusEl.textContent = "Generando imagen con IA...";
  generatedImgWrapper.style.display = 'none';

  const seed = Math.floor(Math.random() * 1000000);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&seed=${seed}&nologo=true`;

  const tempImg = new Image();
  tempImg.onload = () => {
    generatedImg.src = url;
    downloadImgLink.href = url;
    generatedImgWrapper.style.display = 'block';
    statusEl.textContent = "✅ Imagen generada.";
    generateImgBtn.disabled = false;
  };
  tempImg.onerror = () => {
    statusEl.innerHTML = '<span class="error">Error generando la imagen. Intenta de nuevo.</span>';
    generateImgBtn.disabled = false;
  };
  tempImg.src = url;
});
</script>
